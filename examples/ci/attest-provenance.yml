# SLSA build provenance for the Provael wheel/sdist (GitHub Artifact Attestations, SLSA L3).
# Copy into .github/workflows/. Attests what built the artifact, signed via Sigstore + in-toto.
name: Build provenance

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write       # required for keyless signing
  attestations: write   # required to record the attestation

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: uv build
      - name: Attest build provenance (SLSA L3)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      # Verify later with:  gh attestation verify dist/<wheel> --repo provael/provael
