# Example consumer workflow: drop this into a robot/VLA repo at
# .github/workflows/provael.yml to run a Provael red-team gate on every push and PR.
#
# By default this runs the CPU 'stub' policy + suite — fast, no GPU, no model download —
# which is a useful smoke test of the gate wiring. To red-team a *real* policy, run on a
# GPU runner and install the extra (see the commented "real" job at the bottom).
name: Provael red-team

on:
  push:
    branches: [main]
  pull_request:

# The SARIF upload needs permission to write code-scanning results.
permissions:
  contents: read
  security-events: write

jobs:
  redteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Provael red-team gate
        uses: provael/provael@v0.35.0
        with:
          policy: stub
          suite: stub
          # `none` is the benign control the release gate requires.
          attacks: none,instruction,visual,injection,action
          episodes: "10"
          seed: "0"
          asr-threshold: "0.5"   # fail the job if the ADVERSARIAL ASR > 50%
          sarif-output: provael.sarif
          # OPT-IN, and commented out because it ROUGHLY DOUBLES CI TIME: setting `defense` runs a
          # second red-team arm with the defense installed and compares the two.
          #
          # It does NOT lower the number `asr-threshold` gates. That gate keeps reading the
          # UNDEFENDED adversarial ASR on purpose — letting a filter of unproven real-model efficacy
          # move a release gate is how a team ships an unmitigated policy behind a wrapper. The
          # defended figure comes back separately as the `residual-asr` output, alongside
          # `mitigation-verdict` (credited | not-credited | rejected-benign-cost | insufficient).
          # The job fails on `rejected-benign-cost`, and on `insufficient` (which means the benign
          # control is missing, and nothing measured is not a pass).
          # defense: action_envelope

  # Red-teaming a real VLA policy needs a GPU runner and the optional [lerobot] extra.
  # Uncomment and point `runs-on` at your GPU runner:
  #
  # redteam-real:
  #   runs-on: [self-hosted, gpu]
  #   permissions:
