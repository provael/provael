# Recipe: ci-gate — the preset a CI gate runs: the core families, 10 episodes, seed 0.
# Kept byte-identical to the GitHub Action's default `attacks` input (action.yml).
#   provael attack --recipe ci-gate --format sarif --sarif-out provael.sarif
# `none` is the benign control and is REQUIRED: the release gate cannot pass without it,
# and an ASR with no false-positive baseline is not interpretable.
attacks: [none, instruction, visual, injection, action]
episodes: 10
seed: 0
