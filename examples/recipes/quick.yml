# Recipe: quick — fast CPU smoke (instruction family, 5 episodes).
# Mirror of the built-in `quick` recipe. Run either of:
#   provael attack --recipe quick
#   provael attack --recipe ./examples/recipes/quick.yml
# Any explicit flag (e.g. --episodes 20) overrides the values below.
# `none` is the benign control and is REQUIRED: the release gate cannot pass without it,
# and an ASR with no false-positive baseline is not interpretable.
attacks: [none, instruction]
episodes: 5
