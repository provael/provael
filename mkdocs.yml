site_name: Provael
site_description: >-
  Provael™ — red-team open Vision-Language-Action (VLA) robot policies in simulation and report
  an Attack Success Rate (ASR).
site_url: https://docs.provael.com/
repo_url: https://github.com/provael/provael
repo_name: provael/provael
docs_dir: docs
copyright: Apache-2.0 · Independent project · evidence, not certification

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Examples gallery: examples.md
  - Attack catalog: attacks.md
  - Defenses: defenses.md
  - Leaderboard: leaderboard.md
  - Embodied AI Top 10:
      - The list: top10.md
      - RFC process (v0.2 → v0.3): top10-rfc.md
  - Compliance:
      - Crosswalk: compliance/index.md
      - Signed attestation: attestation.md
      - Checkpoint integrity (supply chain): checkpoint-integrity.md
      - Machinery Regulation 2027: compliance/machinery-reg-2027.md
      - Machinery Annex I Part A dossier: compliance/machinery-annex-i-part-a.md
      - Per-persona cards: crosswalk/README.md
      - Halos / ANAB integrator card: crosswalk/halos-integrator.md
      - NIST MEASURE 2.7: measure-2-7.md
      - Sim predicts real: sim-predicts-real.md
  - Standards (drafts):
      - Overview: standards/index.md
      - MITRE ATLAS case study: standards/atlas-case-study.md
      - OWASP Agentic embodied annex: standards/owasp-asi-embodied.md
      - RoboJailBench crosswalk: crosswalk/robojailbench.md
      - ForesightSafety-VLA crosswalk: crosswalk/foresight-safety-vla.md
      - VLA-Arena crosswalk: crosswalk/vla-arena.md
      - SafeVLA-Bench crosswalk: crosswalk/safevla-bench.md
      - Published ASR baselines: standards/published-asr-baselines.md
      - Listings & PRs: standards/listings.md
  - Python API: python-api.md
  - Glossary: glossary.md
  - Migration (schema v2): migration-v2.md
  - vs. LLM red-team tools: comparison.md
  - Handbook (outline): handbook.md
  - Accelerators & TPU: accelerators.md
  - Findings:
      - Overview: findings/index.md
      - Instruction transfer — SmolVLA×LIBERO (2026): findings/2026-instruction-transfer.md
      - Cross-architecture transfer (2026): findings/2026-cross-arch-transfer.md
      - EAI04 action-space transfer: studies/eai04-action-space-transfer.md
      - Instruction canonicalization (defense, measured): studies/instruction-canonicalization.md
      - Action envelope (defense, measured): studies/action-envelope.md
  - Studies (pre-registered):
      - Overview: studies/index.md
      - π0 / openpi transfer: studies/pi0-openpi-transfer.md
      - Meta-World transfer: studies/metaworld-transfer.md
      - Sim-to-real (SO-ARM101): studies/sim-to-real-so101.md
      - Humanoid locomotion (GR00T-N1): studies/humanoid-locomotion-transfer.md
  - Community:
      - Adopters: adopters.md
      - Community & discussions: community.md
  # Both runbooks were already publicly served but absent from the nav — reachable only by guessing
  # the URL. Listing them is the honest resolution rather than hiding them: neither holds a secret,
  # and hosted-production-requirements.md exists precisely so nobody mistakes the experimental
  # reference surface for a production signing service. A document written to prevent a
  # misunderstanding has to be findable to do its job.
  - Maintainers:
      - GitHub security settings: maintainers/github-security-settings.md
      - Hosted production requirements: maintainers/hosted-production-requirements.md
  - Changelog: changelog.md
  - Errata: errata.md
  - FAQ: faq.md
  - Open-core promise: open-core-promise.md
  - Roadmap: roadmap.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  # The docs URLs were uppercase (/TOP10/, /DEFENSES/, /COMPLIANCE/…) and therefore
  # case-sensitive traps: a reader who typed or guessed the lowercase form got a 404, and so did
  # anything that lowercased a URL in transit. Renaming to lowercase fixes that but retires the
  # URLs that are already published, cited and linked — including from the marketing site and from
  # the BibTeX entry in the Top 10 itself. These 301s are what keep the rename from trading one
  # broken-link class for another. Do not delete them: an old URL stays old forever.
  - redirects:
      redirect_maps:
        'TOP10.md': 'top10.md'
        'TOP10_RFC.md': 'top10-rfc.md'
        'DEFENSES.md': 'defenses.md'
        'COMPLIANCE.md': 'compliance/index.md'
        'ATTESTATION.md': 'attestation.md'
        'SIM_PREDICTS_REAL.md': 'sim-predicts-real.md'
        'ADOPTERS.md': 'adopters.md'
        'COMMUNITY.md': 'community.md'
        'MEASURE-2-7.md': 'measure-2-7.md'
        'maintainers/HOSTED_PRODUCTION_REQUIREMENTS.md': 'maintainers/hosted-production-requirements.md'
        'maintainers/GITHUB_SECURITY_SETTINGS.md': 'maintainers/github-security-settings.md'
