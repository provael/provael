[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "provael"
description = "Provael — a model-agnostic tool to red-team open Vision-Language-Action (VLA) robot policies in simulation and report an Attack Success Rate (ASR)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sattyam Jain", email = "sattyamjain96@gmail.com" }]
maintainers = [{ name = "Sattyam Jain", email = "sattyamjain96@gmail.com" }]
keywords = [
    "vla",
    "robotics",
    "red-team",
    "security",
    "adversarial",
    "ai-safety",
    "lerobot",
]
classifiers = [
    # 4 - Beta, not 3 - Alpha: the API has been stable across the release series, the CLI is
    # documented and adopted through four surfaces (package, Action, pre-commit hook, container),
    # and "Alpha" reads to an evaluator as "do not depend on this yet", which is the one audience
    # this package is trying to reach. Not 5 - Production/Stable: the real-model path is measured on
    # one policy and one suite, and saying otherwise here would be the same overclaim the tool exists
    # to catch.
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    # src/provael/py.typed ships, so the package is checkable by a consumer's own mypy.
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "rich",
    "pyyaml",
    "numpy",
    "pillow>=12.3",
]

[project.urls]
# All three of these used to point at GitHub, so the PyPI sidebar offered a visitor no route to
# either the site or the docs — every install landed on a page that could not reach them.
Homepage = "https://www.provael.com"
Documentation = "https://docs.provael.com"
Source = "https://github.com/provael/provael"
Issues = "https://github.com/provael/provael/issues"
Changelog = "https://github.com/provael/provael/blob/main/CHANGELOG.md"

[project.scripts]
provael = "provael.cli:app"

# Optional extra. Kept OUT of the default install so the core stays CPU-only and
# CI never pulls a GPU/ML stack. SmolVLA needs lerobot's own [smolvla] extra
# (transformers) — verified by introspection: base lerobot raises
# "No module named 'transformers'" on importing SmolVLAPolicy. The LIBERO simulator
# additionally needs lerobot[libero] (Part 2).
#
# The 0.5.1 pin is held deliberately, not merely stale: lerobot_adapter.py's per-step rollout was
# read off lerobot's own evaluator for exactly this version ("read, not guessed"), and 0.6.0 moved
# import paths, split the dataset/training deps into new extras and raised the torch floor. Bumping
# it therefore requires re-reading those call signatures and re-running the PROVAEL_INTEGRATION=1
# lane on a GPU box — not a version-string edit. Note lerobot's main branch self-reports 0.6.1, but
# 0.6.0 is the newest release on PyPI; pin only against a published release.
[project.optional-dependencies]
# smolvla -> the policy (transformers); libero -> the simulator (Part 2 above). Both ride this one
# GPU extra so a single `pip install 'provael[lerobot]'` gives the full real SmolVLA x LIBERO path.
lerobot = ["lerobot[smolvla,libero]==0.5.1"]
# SO-ARM101 (SO-101) hardware, for the pre-registered sim-to-real study. DELIBERATELY SEPARATE from
# [lerobot] rather than folded into it: `feetech` is the STS3215 servo-bus driver, and the sim path
# must never pull motor drivers it has no use for — someone installing provael to red-team a policy
# in simulation should not end up with a package that can address a motor bus.
#
# THIS EXTRA ADDS NO ROBOT-CONTROL CODE TO PROVAEL, and provael ships none. provael scores; it does
# not actuate. The extra exists so that on the day an arm arrives, `pip install 'provael[hardware]'`
# gives the operator LeRobot's own SO-101 teleop/record tooling on the same interpreter and the same
# pinned version as the policy — instead of a second environment resolved under time pressure with a
# robot on the bench. See results/hardware/README.md and SAFETY.md.
hardware = ["lerobot[smolvla,libero,feetech]==0.5.1"]
# OpenVLA / OpenVLA-OFT via Hugging Face transformers (the non-LeRobot, model-agnostic path).
# GPU-only; pulled in explicitly by the user, never by the default install or CPU CI.
openvla = ["transformers>=4.40", "torch", "timm", "accelerate", "pillow>=12.3"]
# openpi / pi0 (Physical-Intelligence/openpi) via its CPU-only websocket client — the model runs in
# a separate GPU policy server, so this extra pulls no torch/JAX. The cross-architecture-transfer
# backend. Never pulled by the default install or CPU CI.
openpi = ["openpi-client>=0.1.2"]
# Cryptographic signing/verification for `provael attest`. Kept OUT of the default install so the
# free core stays 6 light deps; `attest` prints a clear install hint when it is missing. The dev
# group also pulls it so CI exercises the real Ed25519 sign/verify path (pure CPU, deterministic).
attest = ["cryptography>=50"]
# The reference hosted attestation server (`provael serve`). Open-core: the server code is
# Apache-2.0 and self-hostable; the operated, project-key-signed instance is the paid tier. Kept OUT
# of the default install so the free CLI/attacks/ASR/SARIF core stays lean and CPU-only.
# cryptography is required, not optional: hosted/server.py exposes `?sign=true`, which calls
# attest.to_bundle(sign=True) and therefore needs Ed25519. Without it here, `pip install
# 'provael[hosted]'` yields a server whose signing endpoint fails at request time rather than at
# install time. Keep the bound in step with the `attest` extra above.
hosted = ["fastapi>=0.110", "uvicorn>=0.27", "cryptography>=50"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
    # Pulled into dev/CI so the real Ed25519 sign/verify path in `provael attest` is exercised
    # (CPU, deterministic). End users get it via the `attest` optional extra, not the base install.
    "cryptography>=50",
]
# Docs site tooling — NOT installed by the default `uv sync` / CPU CI. Build with
# `uv run --group docs mkdocs build --strict`.
docs = [
    "mkdocs-material",
    "mkdocs-jupyter",
    "mike",
    # Serves redirect stubs (meta-refresh HTML pages, HTTP 200 — GitHub Pages cannot emit a real
    # 3xx for a renamed path) for the uppercase docs URLs retired in the lowercase migration.
    # Without it those URLs 404 outright, which trades a case-sensitivity trap for a dead-link one
    # — worse, because the uppercase URLs are the ones already published and linked to. A true 301
    # would need docs.provael.com fronted by a proxy; until then the docs smoke check asserts the
    # stub's body names its lowercase target.
    "mkdocs-redirects",
]

# The `lerobot` and `openpi` extras are mutually exclusive: lerobot pins numpy>=2.0 while
# openpi-client pins numpy<2.0, so they cannot share one environment (an upstream reality, not a
# provael choice). Declaring the conflict lets uv resolve/lock them in separate forks instead of
# failing the universal lock; each still installs fine on its own. They target different backends
# and are run in separate invocations anyway (lerobot in-process vs openpi client->server).
[tool.uv]
conflicts = [
    [{ extra = "lerobot" }, { extra = "openpi" }],
    # [hardware] is [lerobot] plus a servo driver, so it inherits the same numpy>=2.0 pin and the
    # same collision with openpi-client's numpy<2.0. Declared explicitly rather than left to be
    # rediscovered: without this row `uv lock` fails outright on the universal resolve.
    [{ extra = "hardware" }, { extra = "openpi" }],
]

[tool.hatch.version]
path = "src/provael/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/provael"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/provael"]
# GPU-gated adapters are import-guarded and never execute on the CPU lane, so counting their bodies
# as "missed" would understate the covered surface and invite the number to be gamed by deleting
# them. They are excluded from the DENOMINATOR, not hidden: the integration lane exercises them.
omit = [
    "src/provael/policies/openvla_adapter.py",
    "src/provael/policies/openpi_adapter.py",
    "src/provael/policies/groot_adapter.py",
    "src/provael/hosted/*",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "pragma: no cover",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# `S` is flake8-bandit. A tool that publishes other people's attack-success rates should be running
# security lint on itself; not doing so was the kind of gap a reviewer is right to notice.
#
# Enabling it found 2,500 hits, of which 2,466 were S101 (assert) in the test suite — where assert
# is the entire point — and the remaining 34 were triaged one at a time. None was a live defect. The
# suppressions below are scoped by rule and by directory rather than blanket, and every one in
# `src/` is an inline `noqa` carrying its reason, so a future hit has to be argued rather than
# absorbed by a wildcard.
select = ["E", "F", "I", "B", "UP", "W", "C4", "SIM", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# S101: assert IS the test. Suppressed here and nowhere else — an assert in `src/` should still fail
# lint, because a stripped `python -O` run would silently delete it.
# S108/S506: tests build fixture paths under a temp dir and parse the repo's own mkdocs.yml with an
# explicitly restricted Loader; neither reads untrusted input.
# S603/S607: several tests invoke `git`, `uv` and the CLI itself with fixed argv to assert real
# behaviour rather than mock it — that is the point of those tests. S311: a seeded RNG in a
# determinism fixture, where a cryptographic one would defeat the fixture.
"tests/*" = ["E501", "S101", "S108", "S506", "S603", "S607", "S311"]
# Examples and repo tooling shell out to `git`, `modal`, `pip` and friends by name, with fixed argv
# and no user-supplied input. S603/S607 are about untrusted input and PATH ambiguity; pinning
# absolute paths here would make the examples less portable and no safer.
"examples/*" = ["S101", "S110", "S603", "S607"]
"scripts/*" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Optional, untyped deps loaded behind a guarded import in lerobot_adapter.py.
# They are never installed in the CPU build / CI, so mypy must not fail on them.
# cryptography is guarded (lazy) in attest.py and only present via the dev group / attest extra.
module = [
    "lerobot.*", "torch", "libero.*", "transformers.*", "cryptography.*",
    # Optional too: only the offline-observation loader imports it, behind a gated call path.
    "huggingface_hub",
    "fastapi.*", "uvicorn.*", "openpi_client.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The hosted server's routes are registered with FastAPI's decorators, which are untyped here
# (fastapi is an optional [hosted] dep, absent from the CPU build). Relax the untyped-decorator
# rule for this module only — the handlers themselves stay fully typed.
module = ["provael.hosted.server"]
disallow_untyped_decorators = false
