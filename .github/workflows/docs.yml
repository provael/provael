# Build the MkDocs site; on a TAG, publish a versioned docs set with `mike` and move the `latest`
# alias; then smoke-check the live origin.
#
# `build` runs on untrusted PR code — `mkdocs build` executes the `docs` dependency group and any
# plugin hooks the PR adds — so it holds a read-only token and drops the checkout credentials.
# Write scope lives only in `deploy`, which no pull_request event can reach.
#
# WHY TAGS AND NOT PUSH-TO-MAIN, AND WHAT THAT COSTS. Deploy used to fire on every push to main,
# and that was itself a fix: publishing had been manual, so the lowercase URL migration merged and
# the live site served the pre-rename tree for days — /errata/ 404'd, the one page that tells an
# artifact holder to check it before relying on a regulatory date. Versioned docs make main-deploy
# wrong for a different reason: `latest` must mean "the newest RELEASE", and moving it on every
# merge would publish unreleased docs under the alias every reader lands on.
#
# So the incident window is back, narrowed to "between releases" rather than "until someone
# remembers". That is a real cost, accepted deliberately. If it bites — a docs fix that matters
# sitting unpublished behind a release — the fix is NOT to move `latest` on main: deploy main as
# its own version (`mike deploy --branch gh-pages dev`) with no alias change, so main is published
# at /dev/ and `latest` still tracks releases. The smoke job below still runs on every deploy.
name: Docs

on:
  push:
    branches: [main]      # build only — see the `deploy` job's `if:`
    tags: ["v*"]          # build AND publish
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        # Defaults FALSE on purpose: a dispatch is normally used to check the strict build. But
        # `gh workflow run Docs` then reports SUCCESS while publishing nothing, which reads as a
        # working deploy. Pass `-f deploy=true` to actually publish.
        description: "Deploy to gh-pages (REQUIRED to publish — a dispatch without this only builds)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
      - name: Build (strict)
        run: uv run --group docs mkdocs build --strict

  deploy:
    needs: build
    # Tags publish; main does not. The dispatch path stays gated behind `inputs.deploy`.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `mike` pushes to gh-pages, so this checkout MUST keep its credentials.
      #
      # It once said `persist-credentials: false` while the comment above it claimed the opposite,
      # so every deploy failed with `fatal: could not read Username for 'https://github.com'`. The
      # job was rarely reached, so the failure went unnoticed and docs.provael.com served a build
      # from before the DEFENSES page existed — it looked stale rather than broken.
      #
      # fetch-depth: 0 so the existing gh-pages history is present and mike appends to it instead
      # of orphaning it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"

      - name: Resolve the version to publish
        id: ver
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            v="${GITHUB_REF_NAME#v}"          # refs/tags/v0.39.2 -> 0.39.2
          else
            v="$(uv run python -c 'import provael; print(provael.__version__)')"
          fi
          [ -n "$v" ] || { echo "::error::could not resolve a version to publish"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publishing docs for $v"

      - name: Deploy the versioned docs and move the latest alias
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Materialise the existing branch locally so mike appends rather than starting over.
          git fetch origin gh-pages:gh-pages || echo "no gh-pages yet — mike will create it"
          # --alias-type=copy is LOAD-BEARING, not a preference. mike's default writes `latest` as a
          # git SYMLINK (mode 120000), and GitHub Pages does not serve symlinked directories: every
          # /latest/… URL would 404, which is worse than not versioning at all. `redirect` is also
          # wrong here — it would make every alias URL bounce to a DATED /0.39.2/… path, and a
          # stable undated URL is the entire reason `latest` exists.
          uv run --group docs mike deploy --branch gh-pages --alias-type=copy \
            --update-aliases "${{ steps.ver.outputs.version }}" latest
          uv run --group docs mike set-default --branch gh-pages latest

      # mike namespaces everything under the version path, so without this every published URL
      # (/top10/, /errata/, and the retired UPPERCASE ones) 404s at the root. An old URL stays old
      # forever — see scripts/gen_root_stubs.py. `--check` afterwards makes a generator that wrote
      # nothing distinguishable from one with nothing to write.
      - name: Keep every pre-versioning URL alive at the root
        run: |
          set -euo pipefail
          git worktree add ../ghp gh-pages
          uv run python scripts/gen_root_stubs.py --root ../ghp
          uv run python scripts/gen_root_stubs.py --root ../ghp --check
          git -C ../ghp add -A
          git -C ../ghp diff --cached --quiet && echo "no new root stubs" || \
            git -C ../ghp commit -m "docs: root stubs for the pre-versioning URLs"

      - name: Push gh-pages
        run: git push origin gh-pages

  # A docs deploy that silently publishes a broken tree is exactly how /errata/ spent days
  # unreachable while every build stayed green: the repo checks cannot see the origin. This job
  # asks the origin. It polls (Pages builds + CDN propagation take a minute or two) and fails the
  # workflow on any page that never turns up.
  #
  # Versioning DOUBLED what has to be checked. Every page now has two live forms and both can break
  # independently: the real page under /latest/, and the root stub that keeps the published URL
  # alive. Checking only one would let the other rot — and the root form is the one that is cited.
  #
  # On the redirects: both the retired uppercase URLs and the new root stubs are meta-refresh pages,
  # which answer HTTP 200 — GitHub Pages cannot emit a real 301/302 for a renamed path, so a
  # status-code assertion is not available from this repo. The stub's BODY must name its target, and
  # that is what is asserted.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    permissions: {}  # pure outside-in probe; no repo access needed
    steps:
      - name: Smoke-check the live origin
        run: |
          set -u
          ORIGIN="https://docs.provael.com"
          BUST="smoke=${GITHUB_RUN_ID}"

          # Real pages, under the alias. /errata/ and /top10/ are here by name because they are the
          # two this check exists for: the corrections register and the most-cited page.
          PAGES="/latest/ /latest/errata/ /latest/top10/ /latest/changelog/ /latest/leaderboard/ /latest/findings/ /latest/studies/ /latest/standards/ /latest/compliance/ /latest/maintainers/github-security-settings/"

          # Root paths that were published before versioning -> the alias path their stub must name.
          # These are the cited ones; if any of these breaks, versioning has cost more than it bought.
          ROOT="/top10/=/latest/top10/ /errata/=/latest/errata/ /changelog/=/latest/changelog/ /leaderboard/=/latest/leaderboard/ /compliance/=/latest/compliance/ /standards/=/latest/standards/"

          # Retired uppercase paths -> the lowercase target their stub chain must reach.
          REDIRECTS="/TOP10/=/latest/top10/ /TOP10_RFC/=/latest/top10-rfc/ /DEFENSES/=/latest/defenses/ /COMPLIANCE/=/latest/compliance/ /ATTESTATION/=/latest/attestation/ /SIM_PREDICTS_REAL/=/latest/sim-predicts-real/ /ADOPTERS/=/latest/adopters/ /COMMUNITY/=/latest/community/ /MEASURE-2-7/=/latest/measure-2-7/"

          # The front door must redirect into the alias, or docs.provael.com itself is a dead end.
          ROOTINDEX="/=/latest/"

          fail=0
          probe() {  # $1 = path; $2 = required body substring ("" = none). 12 tries x 15s.
            for i in $(seq 1 12); do
              body="$(curl -fsS --max-time 20 "${ORIGIN}$1?${BUST}-${i}" 2>/dev/null)" || body=""
              if [ -n "$body" ] && { [ -z "$2" ] || printf '%s' "$body" | grep -qF "$2"; }; then
                echo "ok   $1"
                return 0
              fi
              sleep 15
            done
            echo "FAIL $1 (never served${2:+ a page naming $2})"
            return 1
          }

          for p in $PAGES; do probe "$p" "" || fail=1; done
          for pair in $ROOTINDEX $ROOT $REDIRECTS; do
            probe "${pair%%=*}" "${pair##*=}" || fail=1
          done
          exit $fail
