# Build the MkDocs site; deploy to GitHub Pages on every push to main (and on a gated manual
# dispatch), then smoke-check the live origin.
#
# `build` runs on untrusted PR code — `mkdocs build` executes the `docs` dependency group and any
# plugin hooks the PR adds — so it holds a read-only token and drops the checkout credentials.
# Write scope lives only in `deploy`, which no pull_request event can reach.
#
# WHY DEPLOY-ON-PUSH. Deploy used to be reachable ONLY via `workflow_dispatch` with
# `deploy=true`, so publishing docs.provael.com was a manual step nobody was reminded to take.
# The result: the lowercase URL migration (plus the errata register, the changelog page, the
# maintainer runbooks, and the findings/studies/standards hubs) merged to main and the live site
# kept serving the pre-rename tree for days — /errata/ 404'd, which is the one page that tells an
# artifact holder to check it before relying on a regulatory date. A green repo says nothing
# about the origin; the fix is that main IS the published tree, plus the smoke job below.
name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        # Defaults FALSE on purpose: a dispatch is normally used to check the strict build. But
        # `gh workflow run Docs` then reports SUCCESS while publishing nothing, which reads as a
        # working deploy. Pass `-f deploy=true` to actually publish.
        description: "Deploy to gh-pages (REQUIRED to publish — a dispatch without this only builds)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Build (strict)
        run: uv run --group docs mkdocs build --strict

  deploy:
    needs: build
    # Push events are already limited to main by `on.push.branches`; the ref check restates it as
    # defense in depth. The dispatch path stays gated behind `inputs.deploy` for ad-hoc republishes.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh-deploy runs `git push origin gh-pages`, so this checkout MUST keep its credentials.
      #
      # It said `persist-credentials: false` while the comment above it claimed the opposite, so
      # every deploy failed with `fatal: could not read Username for 'https://github.com'`. The job
      # is gated behind `workflow_dispatch` + `inputs.deploy`, so it had almost never been run and
      # the failure went unnoticed — docs.provael.com served a build from before the DEFENSES page
      # and both measured-defense studies existed, and looked merely "stale" rather than broken.
      #
      # Keeping credentials here is safe and is the point of the two-job split: `build` runs
      # untrusted PR code with a read-only token and drops credentials, while `deploy` carries write
      # scope and CANNOT be reached by a pull_request event.
      #
      # fetch-depth: 0 so mkdocs commits onto the existing gh-pages branch instead of orphaning it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Deploy to gh-pages
        run: uv run --group docs mkdocs gh-deploy --force

  # A docs deploy that silently publishes a broken tree is exactly how /errata/ spent days
  # unreachable while every build stayed green: the repo checks cannot see the origin. This job
  # asks the origin. It polls (Pages builds + CDN propagation take a minute or two) and fails the
  # workflow on any page that never turns up.
  #
  # On the redirects: the uppercase URLs retired in the lowercase migration are served by
  # mkdocs-redirects as meta-refresh stub pages, which answer HTTP 200 — GitHub Pages cannot emit
  # a real 301/302 for a renamed path, so a status-code assertion is not available from this repo.
  # The stub's BODY must point at the lowercase target, and that is what is asserted. If
  # docs.provael.com is ever fronted by a proxy that can 301 (the marketing site's Cloudflare
  # zone can), tighten this to expect 3xx and delete this paragraph.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    permissions: {}  # pure outside-in probe; no repo access needed
    steps:
      - name: Smoke-check the live origin
        run: |
          set -u
          ORIGIN="https://docs.provael.com"
          BUST="smoke=${GITHUB_RUN_ID}"

          # Pages that must answer 200. /errata/ and /top10/ are here by name because they are
          # the two this check exists for: the corrections register and the most-cited page.
          PAGES="/ /errata/ /top10/ /changelog/ /leaderboard/ /findings/ /studies/ /standards/ /compliance/ /maintainers/github-security-settings/"

          # Retired uppercase paths -> the lowercase target their redirect stub must name.
          REDIRECTS="/TOP10/=/top10/ /TOP10_RFC/=/top10-rfc/ /DEFENSES/=/defenses/ /COMPLIANCE/=/compliance/ /ATTESTATION/=/attestation/ /SIM_PREDICTS_REAL/=/sim-predicts-real/ /ADOPTERS/=/adopters/ /COMMUNITY/=/community/ /MEASURE-2-7/=/measure-2-7/"

          fail=0
          probe() {  # $1 = path; $2 = required body substring ("" = none). 12 tries x 15s.
            for i in $(seq 1 12); do
              body="$(curl -fsS --max-time 20 "${ORIGIN}$1?${BUST}-${i}" 2>/dev/null)" || body=""
              if [ -n "$body" ] && { [ -z "$2" ] || printf '%s' "$body" | grep -qF "$2"; }; then
                echo "ok   $1"
                return 0
              fi
              sleep 15
            done
            echo "FAIL $1 (never served${2:+ a page naming $2})"
            return 1
          }

          for p in $PAGES; do probe "$p" "" || fail=1; done
          for pair in $REDIRECTS; do
            probe "${pair%%=*}" "${pair##*=}" || fail=1
          done
          exit $fail
