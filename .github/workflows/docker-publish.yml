name: docker-publish

# Tags only, plus a manual button. NOT on every push to main: a `:latest` that moves with every
# commit is a worse promise than no image, because the README tells strangers to run it and they
# would each get a different build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege at the top; the one job that pushes an image opts into `packages: write`.
permissions:
  contents: read

# GHCR IS THE ONLY REGISTRY. A Docker Hub mirror used to sit beside it under a personal namespace
# (docker.io/mndfreek/provael), because a Docker Hub organisation named `provael` costs a Team plan
# ($180/year) to make one string match another string. The mirror's secrets were never set, so the
# step had only ever printed a warning: a half-configured publishing path that read as a second
# image to a stranger and as a smell to a diligence reader. Removed on 20 September 2026; the
# decision is one registry, ghcr.io/provael/provael, matching the GitHub org that builds it.
jobs:
  publish:
    name: build and push ghcr.io/provael/provael
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # QEMU is what makes the arm64 half of the manifest buildable on an x86_64 runner.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/provael/provael
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          # BOTH ARCHITECTURES, and arm64 is not optional. The first publish built amd64 only,
          # because that is what the runner is, and `docker pull` from an Apple Silicon Mac then
          # failed outright:
          #
          #     no matching manifest for linux/arm64/v8 in the manifest list entries
          #
          # Nothing in CI could have caught it: the build smoke test runs on the same x86_64 runner,
          # so it sees a working image. It only surfaced by pulling on the target machine. Most
          # developers who will try the README's docker line are on arm64.
          #
          # arm64 cross-builds under QEMU and is slower than the native half. That is the price.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The first push creates the package PRIVATE. A private package makes the README's
      # `docker run` line fail with an auth error for every stranger, which is worse than shipping
      # no image at all — the README would be advertising something broken. This step cannot flip
      # visibility (GITHUB_TOKEN lacks the scope), so it says so loudly instead of pretending.
      - name: Remind that the package must be made public once
        run: |
          echo "::notice title=One-time manual step::If this is the FIRST publish, set the package"\
          " to public: github.com/orgs/provael/packages/container/provael/settings ->"\
          " Danger Zone -> Change visibility -> Public. Until then 'docker run"\
          " ghcr.io/provael/provael:latest' fails for everyone who is not logged in."
