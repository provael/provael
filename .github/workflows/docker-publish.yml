name: docker-publish

# Tags only, plus a manual button. NOT on every push to main: a `:latest` that moves with every
# commit is a worse promise than no image, because the README tells strangers to run it and they
# would each get a different build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: build and push ghcr.io/provael/provael + docker.io/provael/provael
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # QEMU is what makes the arm64 half of the manifest buildable on an x86_64 runner.
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # DOCKER HUB IS OPTIONAL AND FAILS SOFT, deliberately. GHCR authenticates with the built-in
      # GITHUB_TOKEN and always works; Docker Hub needs an org access token that is configured out
      # of band. If it is missing, this job must still publish to GHCR rather than turning the whole
      # release red — the two registries are independent promises and one being unconfigured is not
      # a reason to withhold the other.
      #
      # The consequence is stated loudly at the end of the job rather than swallowed, because a
      # SILENT skip would leave the README advertising a Docker Hub image that does not exist, which
      # is worse than shipping no image at all.
      - id: hub
        name: Is Docker Hub configured?
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$HUB_USER" ] && [ -n "$HUB_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.hub.outputs.configured == 'true'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          # BOTH REGISTRIES FROM ONE BUILD. metadata-action fans the same tag set across every image
          # listed here, and build-push-action pushes one manifest to each — so ghcr and Docker Hub
          # cannot drift to different bits under the same version, which a second build step could
          # not guarantee. Docker Hub drops out of the list when unconfigured.
          images: |
            ghcr.io/provael/provael
            ${{ steps.hub.outputs.configured == 'true' && 'docker.io/provael/provael' || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          # BOTH ARCHITECTURES, and arm64 is not optional. The first publish built amd64 only,
          # because that is what the runner is, and `docker pull` from an Apple Silicon Mac then
          # failed outright:
          #
          #     no matching manifest for linux/arm64/v8 in the manifest list entries
          #
          # Nothing in CI could have caught it: the build smoke test runs on the same x86_64 runner,
          # so it sees a working image. It only surfaced by pulling on the target machine. Most
          # developers who will try the README's docker line are on arm64.
          #
          # arm64 cross-builds under QEMU and is slower than the native half. That is the price.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Say plainly whether Docker Hub was published
        run: |
          if [ "${{ steps.hub.outputs.configured }}" = "true" ]; then
            echo "::notice title=Docker Hub::pushed docker.io/provael/provael (0.x + latest)"
          else
            echo "::warning title=Docker Hub NOT published::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN"\
            " are not set, so only ghcr.io was pushed. README and docs must not tell users to"\
            " 'docker pull provael/provael' until this is configured — set the secrets at"\
            " github.com/provael/provael/settings/secrets/actions and re-run this workflow."
          fi

      # The first push creates the package PRIVATE. A private package makes the README's
      # `docker run` line fail with an auth error for every stranger, which is worse than shipping
      # no image at all — the README would be advertising something broken. This step cannot flip
      # visibility (GITHUB_TOKEN lacks the scope), so it says so loudly instead of pretending.
      - name: Remind that the package must be made public once
        run: |
          echo "::notice title=One-time manual step::If this is the FIRST publish, set the package"\
          " to public: github.com/orgs/provael/packages/container/provael/settings ->"\
          " Danger Zone -> Change visibility -> Public. Until then 'docker run"\
          " ghcr.io/provael/provael:latest' fails for everyone who is not logged in."
