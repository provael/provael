# OpenSSF Scorecard — supply-chain hygiene for the repo (a security tool should score well itself).
# Publishes results to the Security tab (code scanning) and the OpenSSF dashboard.
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "37 6 * * 1"   # weekly, Monday 06:37 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          sarif_file: results.sarif
          category: ossf-scorecard
