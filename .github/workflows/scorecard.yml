# OpenSSF Scorecard — supply-chain hygiene for the repo (a security tool should score well itself).
# Publishes results to the Security tab (code scanning) and the OpenSSF dashboard.
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "37 6 * * 1"   # weekly, Monday 06:37 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: ossf-scorecard
