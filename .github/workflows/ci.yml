name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the repo. A PR from a fork therefore cannot use
# it to obtain a write token or secrets.
permissions:
  contents: read

# Don't pile up runs on a busy branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CPU-only by design: this workflow NEVER installs the optional `[lerobot]` extra,
# so it pulls no torch / transformers / GPU stack. The LeRobot integration tests are
# gated (PROVAEL_INTEGRATION) and skip here automatically.
#
# Coverage note — the prompt's required checks map to jobs here:
#   lint / typing / unit ............ `check` (ruff / mypy / pytest)
#   schema-migration + golden ....... pytest (test_assurance drift guard, test_manifest drift guard)
#   evidence-integrity + property ... pytest (test_attest, test_adversarial_asr, test_evidence_state,
#                                     test_verdict, test_action_schema)
#   public-manifest gen + diff ...... pytest (test_manifest checked-in drift guard)
#   package build + metadata ........ `build` (uv build + twine check)
#   docs strict ..................... .github/workflows/docs.yml
#   optional integration ............ gated (PROVAEL_INTEGRATION); skips here. The real-model path
#                                     runs in gpu-scheduled.yml (scheduled, and only when the
#                                     ENABLE_GPU_SCHEDULED repo variable is "true"), NOT as a release
#                                     gate — release.yml re-runs this CPU gate plus a tag/version
#                                     match, but it does not run the GPU integration tests.
jobs:
  check:
    name: ruff + mypy + pytest (CPU, no lerobot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # tests/test_version_consistency.py resolves every documented `@vX.Y.Z` pin against the
          # real tag list. A default shallow checkout fetches no tags, which would leave that guard
          # unable to verify anything — so it asserts it is not running tagless in CI rather than
          # skipping. Dropping this makes the version guard fail loudly, not pass vacuously.
          #
          # `fetch-depth: 0` and not `fetch-tags: true`: the latter was tried first and CI still
          # came up tagless on a PR's merge ref, which the guard caught. Full history is cheap on
          # a repo this size and is unambiguous.
          fetch-depth: 0

      - name: Install uv (pinned Python 3.12)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync core + dev (no extras)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy, strict)
        # `scripts/action` is included deliberately: those five scripts decide whether a release
        # passes, and they spent their whole life inside action.yml as shell heredocs where no
        # linter or type-checker could see them. Extracting them only pays off if the checks
        # actually run on them.
        run: uv run mypy src scripts/action

      # Case-exact relative-link check. It has to run HERE, on Linux, and not as a local pre-commit:
      # macOS and Windows are case-insensitive, so a link to docs/TOP10.md resolves fine on the
      # author's machine and 404s for every visitor on github.com. The author cannot see the bug
      # they just shipped. This runner is case-sensitive, which is the point.
      - name: Link check (relative markdown links, case-exact)
        run: uv run python scripts/check_links.py

      # A published board's rows age without a byte of it changing, and the only thing that said so
      # was a banner the Space renders. A consumer reading leaderboard.json got four rates, an
      # Ed25519 signature, and nothing machine-readable to tell it the signature vouches for a
      # measurement rather than for its currency.
      #
      # This fails on UNDECLARED staleness only — a board more than MAX_MINOR_LAG minors behind the
      # running release that does not carry `stale: true`. Failing on staleness itself would be red
      # today and red until a GPU re-run nobody has scheduled, and a permanently-red detector
      # reports nothing. Disclosed staleness is the honest state; silent staleness is the bug.
      - name: Leaderboard staleness is declared, not implied
        run: uv run python scripts/check_leaderboard_staleness.py

      # COVERAGE IS MEASURED AND PUBLISHED, not asserted. The repo had 90 test modules and no
      # figure anywhere, which is exactly the shape of claim this project refuses to accept from
      # anyone else: "well tested" with no denominator.
      #
      # `--cov-fail-under` is a FLOOR, not a target, and it is deliberately a few points below the
      # measured value. A gate pinned at the current number fires on ordinary refactors, and a gate
      # that fires on noise gets raised until it means nothing. The real number is printed on every
      # run and written to the job summary, so a slide shows up as a number moving rather than as a
      # threshold being edited.
      - name: Test (pytest, CPU only) + coverage
        run: |
          uv run pytest -q --cov=src/provael --cov-report=term --cov-report=xml --cov-fail-under=85 \
            | tee /tmp/pytest.out
          COV=$(grep -E '^TOTAL' /tmp/pytest.out | awk '{print $NF}')
          echo "### Coverage: ${COV}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^TOTAL|^Name' /tmp/pytest.out >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"


      # Build the image on every PR, push nothing. The Dockerfile pinned uv 0.5.11 against a
      # `revision = 3` lockfile that version cannot parse, so `uv sync --locked` failed — and it had
      # been failing for a while, invisibly, because nothing ever built it. A Dockerfile that ships
      # in the repo and is never exercised is a promise nobody checks.
      #
      # Smoke-run the entrypoint too: a green build only proves it compiled, not that
      # `docker run <image> attack ...` reaches the CLI, which is what the README will tell people.
      - name: Build the Docker image (no push) and smoke the entrypoint
        run: |
          docker build -t provael:ci .
          docker run --rm provael:ci --version

  # Every label an issue FORM declares must exist on the repository.
  #
  # THE INCIDENT. Six intake forms declared five labels and not one existed. GitHub does not error
  # on an unknown label in a form; it drops it silently, so every issue filed through a form
  # arrived unlabelled — including through evidence-defect.yml, the channel for reporting that a
  # published number might be wrong.
  #
  # The check is scripts/check_issue_labels.py so it can be run and negative-tested locally rather
  # than only in CI. Read-only on purpose: it names the missing label and the form that declares
  # it, and does NOT create it. Creating one silently is how the next person never learns the form
  # was wrong.
  labels:
    name: issue-form labels exist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_issue_labels.py

  build:
    name: package build + metadata check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv (pinned Python 3.12)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

  audit:
    name: dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv (pinned Python 3.12)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      # Audit the locked dependency set for known CVEs. Documented exception mechanism: add an
      # `--ignore-vuln <ID>` with a dated justification in a review comment when a fix is unavailable.
      #
      # `-r` is load-bearing. A bare `uvx pip-audit` audits the ephemeral environment uvx builds for
      # pip-audit itself, never the project — it passed on every run while pillow shipped 13 open
      # advisories in the default install. Always audit an exported requirements file.
      #
      # `--no-emit-project` is equally load-bearing, for the opposite reason. Without it the export
      # carries provael itself, and `--strict` fails on "Dependency not found on PyPI" for the very
      # version being prepared — so every RELEASE PR failed this gate, since the version under
      # release is by definition not published yet. We audit our dependencies, not our own artifact.
      - name: Audit dependencies (pip-audit)
        run: |
          uv export --no-emit-project --no-hashes --no-annotate --quiet \
            --format requirements-txt -o audit-default.txt
          grep -qE '^pillow==' audit-default.txt \
            || { echo "::error::export produced no runtime deps — the audit would be vacuous"; exit 1; }
          uvx pip-audit --strict --progress-spinner off -r audit-default.txt

      # The GPU extras are not what `pip install provael` resolves, and torch advisories routinely
      # have no fixed version, so this lane reports without gating. `lerobot` and `openpi` are
      # declared conflicts and cannot be exported together.
      - name: Audit GPU extras (informational)
        continue-on-error: true
        run: |
          uv export --extra lerobot --extra openvla --extra attest --extra hosted \
            --no-emit-project --no-hashes --no-annotate --quiet \
            --format requirements-txt -o audit-extras.txt
          uvx pip-audit --progress-spinner off -r audit-extras.txt
