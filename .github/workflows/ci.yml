name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the repo. A PR from a fork therefore cannot use
# it to obtain a write token or secrets.
permissions:
  contents: read

# Don't pile up runs on a busy branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CPU-only by design: this workflow NEVER installs the optional `[lerobot]` extra,
# so it pulls no torch / transformers / GPU stack. The LeRobot integration tests are
# gated (PROVAEL_INTEGRATION) and skip here automatically.
#
# Coverage note — the prompt's required checks map to jobs here:
#   lint / typing / unit ............ `check` (ruff / mypy / pytest)
#   schema-migration + golden ....... pytest (test_assurance drift guard, test_manifest drift guard)
#   evidence-integrity + property ... pytest (test_attest, test_adversarial_asr, test_evidence_state,
#                                     test_verdict, test_action_schema)
#   public-manifest gen + diff ...... pytest (test_manifest checked-in drift guard)
#   package build + metadata ........ `build` (uv build + twine check)
#   docs strict ..................... .github/workflows/docs.yml
#   optional integration ............ gated (PROVAEL_INTEGRATION); skips here. The real-model path
#                                     runs in gpu-nightly.yml (scheduled, and only when the
#                                     ENABLE_GPU_NIGHTLY repo variable is "true"), NOT as a release
#                                     gate — release.yml re-runs this CPU gate plus a tag/version
#                                     match, but it does not run the GPU integration tests.
jobs:
  check:
    name: ruff + mypy + pytest (CPU, no lerobot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # tests/test_version_consistency.py resolves every documented `@vX.Y.Z` pin against the
          # real tag list. A default shallow checkout fetches no tags, which would leave that guard
          # unable to verify anything — so it asserts it is not running tagless in CI rather than
          # skipping. Dropping this makes the version guard fail loudly, not pass vacuously.
          #
          # `fetch-depth: 0` and not `fetch-tags: true`: the latter was tried first and CI still
          # came up tagless on a PR's merge ref, which the guard caught. Full history is cheap on
          # a repo this size and is unambiguous.
          fetch-depth: 0

      - name: Install uv (pinned Python 3.12)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync core + dev (no extras)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy, strict)
        run: uv run mypy src

      - name: Test (pytest, CPU only)
        run: uv run pytest -q

  build:
    name: package build + metadata check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv (pinned Python 3.12)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

  audit:
    name: dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv (pinned Python 3.12)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      # Audit the locked dependency set for known CVEs. Documented exception mechanism: add an
      # `--ignore-vuln <ID>` with a dated justification in a review comment when a fix is unavailable.
      #
      # `-r` is load-bearing. A bare `uvx pip-audit` audits the ephemeral environment uvx builds for
      # pip-audit itself, never the project — it passed on every run while pillow shipped 13 open
      # advisories in the default install. Always audit an exported requirements file.
      #
      # `--no-emit-project` is equally load-bearing, for the opposite reason. Without it the export
      # carries provael itself, and `--strict` fails on "Dependency not found on PyPI" for the very
      # version being prepared — so every RELEASE PR failed this gate, since the version under
      # release is by definition not published yet. We audit our dependencies, not our own artifact.
      - name: Audit dependencies (pip-audit)
        run: |
          uv export --no-emit-project --no-hashes --no-annotate --quiet \
            --format requirements-txt -o audit-default.txt
          grep -qE '^pillow==' audit-default.txt \
            || { echo "::error::export produced no runtime deps — the audit would be vacuous"; exit 1; }
          uvx pip-audit --strict --progress-spinner off -r audit-default.txt

      # The GPU extras are not what `pip install provael` resolves, and torch advisories routinely
      # have no fixed version, so this lane reports without gating. `lerobot` and `openpi` are
      # declared conflicts and cannot be exported together.
      - name: Audit GPU extras (informational)
        continue-on-error: true
        run: |
          uv export --extra lerobot --extra openvla --extra attest --extra hosted \
            --no-emit-project --no-hashes --no-annotate --quiet \
            --format requirements-txt -o audit-extras.txt
          uvx pip-audit --progress-spinner off -r audit-extras.txt
