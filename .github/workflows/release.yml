name: Release

# Tag-triggered release: build sdist + wheel, publish to PyPI via OIDC TRUSTED
# PUBLISHING (no API token stored anywhere), then cut a GitHub Release from the
# CHANGELOG.
#
# ────────────────────────────────────────────────────────────────────────────
# ONE-TIME MAINTAINER SETUP (PyPI trusted publisher — no secrets in the repo):
#   1. Create the project owner account on https://pypi.org.
#   2. PyPI → your account → "Publishing" → "Add a new pending publisher":
#        PyPI project name : provael
#        Owner             : provael
#        Repository name   : provael
#        Workflow name     : release.yml
#        Environment name  : pypi
#   3. In GitHub → repo Settings → Environments → create an environment named "pypi"
#      (optionally add required reviewers / a tag protection rule).
#   4. Publish by pushing a tag that matches the version, e.g.:
#        git tag v0.1.0 && git push origin v0.1.0
#   (For a first dry run, point step `publish` at TestPyPI by setting
#    `repository-url: https://test.pypi.org/legacy/` and adding the matching pending
#    publisher on test.pypi.org.)
# ────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags: ["v*"]

permissions: {}  # least privilege by default; jobs opt into exactly what they need

jobs:
  # A tag can be pushed at any commit, so passing CI on `main` does not imply this tree is green.
  # Publishing to PyPI is irreversible (a version number can never be reused), so the same gate CI
  # runs must pass here before anything is built or uploaded.
  changelog-gate:
    name: CHANGELOG documents this tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # No uv, no install: a stdlib script, so the cheapest job in the workflow runs first and
      # a missing changelog section costs seconds rather than a full test matrix.
      #
      # This gates the WHOLE workflow rather than warning at release-notes time, because publishing
      # is irreversible: PyPI will not let a version number be reused, so by the time the old
      # fallback wrote "Release v0.31.1" as the body the artifact was already out.
      - name: Refuse to release a version CHANGELOG.md does not document
        run: python3 scripts/check_changelog.py "${GITHUB_REF_NAME}"

  check:
    name: ruff + mypy + pytest (CPU, no lerobot)
    needs: changelog-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read  # only to check out the tagged tree
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Full history, for the same reason ci.yml needs it: this job re-runs the whole test
          # suite, and tests/test_version_consistency.py resolves every documented `@vX.Y.Z` pin
          # against the real tag list. A default shallow checkout of a TAG resolves almost no
          # tags, so the guard reported v0.25.0 and v0.3.0 -- both real -- as nonexistent and
          # failed the release. ci.yml got this in #62; release.yml re-runs the same gate from
          # its own checkout and was missed, so v0.26.0 was the first release to hit it.
          fetch-depth: 0
      - name: Install uv (pinned Python 3.12)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync core + dev (no extras)
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Type-check (mypy, strict)
        run: uv run mypy src
      - name: Test (pytest, CPU only)
        run: uv run pytest -q
      - name: Tag matches the packaged version
        # Catches the classic release slip: tagging v0.25.0 while __init__.py still says 0.24.0.
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv run python -c 'import provael; print(provael.__version__)')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match packaged version ${pkg}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches packaged version ${pkg}"

  build:
    name: Build sdist + wheel
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install uv (Python 3.12)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Build distributions
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI (OIDC trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # REQUIRED for OIDC trusted publishing — no token needed
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish
        # Pinned to a fixed version (was the moving `@release/v1`); >=1.11.0 for PEP 740.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true  # don't hard-fail if a re-run hits an already-uploaded version
          attestations: true   # PEP 740: emit signed provenance attestations alongside the upload
        # No `password:` — trusted publishing uses the OIDC id-token above.

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Extract changelog notes for this tag
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          # NO FALLBACK. This used to write "Release ${GITHUB_REF_NAME}" when the extract came back
          # empty, which is how 0.31.1 shipped with no notes and had to be back-filled afterwards.
          # changelog-gate has already proven the section exists, so an empty extract here means the
          # awk range broke, not that the changelog is missing — and silently substituting a
          # placeholder would hide a real regression in the extractor.
          if [ ! -s release-notes.md ]; then
            echo "::error::changelog-gate passed for ${GITHUB_REF_NAME} but the awk extract is empty."
            echo "::error::The heading exists and the range extraction is broken. Not substituting a placeholder."
            exit 1
          fi
      - name: Install uv (Python 3.12)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Generate CycloneDX SBOM + SHA-256 checksums
        run: |
          uv sync --locked --no-dev
          uvx --from cyclonedx-bom cyclonedx-py environment .venv \
            --output-file dist/provael-sbom.cyclonedx.json
          ( cd dist && sha256sum *.whl *.tar.gz *.json > SHA256SUMS )
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # dist/* now includes the sdist + wheel, the CycloneDX SBOM, and SHA256SUMS.
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
