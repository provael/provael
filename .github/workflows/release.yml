name: Release

# Tag-triggered release: build sdist + wheel, publish to PyPI via OIDC TRUSTED
# PUBLISHING (no API token stored anywhere), then cut a GitHub Release from the
# CHANGELOG.
#
# ────────────────────────────────────────────────────────────────────────────
# ONE-TIME MAINTAINER SETUP (PyPI trusted publisher — no secrets in the repo):
#   1. Create the project owner account on https://pypi.org.
#   2. PyPI → your account → "Publishing" → "Add a new pending publisher":
#        PyPI project name : provael
#        Owner             : provael
#        Repository name   : provael
#        Workflow name     : release.yml
#        Environment name  : pypi
#   3. In GitHub → repo Settings → Environments → create an environment named "pypi"
#      (optionally add required reviewers / a tag protection rule).
#   4. Publish by pushing a tag that matches the version, e.g.:
#        git tag v0.1.0 && git push origin v0.1.0
#   (For a first dry run, point step `publish` at TestPyPI by setting
#    `repository-url: https://test.pypi.org/legacy/` and adding the matching pending
#    publisher on test.pypi.org.)
# ────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags: ["v*"]

permissions: {}  # least privilege by default; jobs opt into exactly what they need

jobs:
  # A tag can be pushed at any commit, so passing CI on `main` does not imply this tree is green.
  # Publishing to PyPI is irreversible (a version number can never be reused), so the same gate CI
  # runs must pass here before anything is built or uploaded.
  check:
    name: ruff + mypy + pytest (CPU, no lerobot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read  # only to check out the tagged tree
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install uv (pinned Python 3.12)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync core + dev (no extras)
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Type-check (mypy, strict)
        run: uv run mypy src
      - name: Test (pytest, CPU only)
        run: uv run pytest -q
      - name: Tag matches the packaged version
        # Catches the classic release slip: tagging v0.25.0 while __init__.py still says 0.24.0.
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv run python -c 'import provael; print(provael.__version__)')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match packaged version ${pkg}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches packaged version ${pkg}"

  build:
    name: Build sdist + wheel
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install uv (Python 3.12)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - name: Build distributions
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI (OIDC trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # REQUIRED for OIDC trusted publishing — no token needed
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Publish
        # Pinned to a fixed version (was the moving `@release/v1`); >=1.11.0 for PEP 740.
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          skip-existing: true  # don't hard-fail if a re-run hits an already-uploaded version
          attestations: true   # PEP 740: emit signed provenance attestations alongside the upload
        # No `password:` — trusted publishing uses the OIDC id-token above.

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Extract changelog notes for this tag
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "Release ${GITHUB_REF_NAME}" > release-notes.md; fi
      - name: Install uv (Python 3.12)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - name: Generate CycloneDX SBOM + SHA-256 checksums
        run: |
          uv sync --locked --no-dev
          uvx --from cyclonedx-bom cyclonedx-py environment .venv \
            --output-file dist/provael-sbom.cyclonedx.json
          ( cd dist && sha256sum *.whl *.tar.gz *.json > SHA256SUMS )
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # dist/* now includes the sdist + wheel, the CycloneDX SBOM, and SHA256SUMS.
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
