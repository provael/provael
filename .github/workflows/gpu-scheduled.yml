# Scheduled real-model GPU red-team (SmolVLA x LIBERO) via Modal — budget-capped, OFF by default.
#
# This runs the GATED integration path on a real GPU on a schedule, so the repo's honest transfer
# numbers stay fresh without a maintainer running anything by hand. It is deliberately isolated from
# ci.yml: the CPU core CI never installs the [lerobot] extra, never touches a GPU, and stays free and
# green regardless of this file.
#
# WHAT ONE RUN IS, SINCE 18 SEPTEMBER 2026: THE NEXT SHARDS OF A DECLARED CAMPAIGN, NOT A PROBE.
# Each run used to measure one task, eight arms, two seeds — sixteen episodes that kept
# watch/freshness.json fed and could not move watch/publish-freshness.json at all. The published
# measurement is the largest body of real runs at one lineage (policy, suite, task suite) and one
# version (550 attempts over ten libero_object tasks at 0.32.0); the probe added fourteen attempts on ONE task per run, under a version
# bucket that reset every time a release re-pinned it. It measured on the current release twice a
# week and could not have displaced the published campaign this decade.
#
# So each run now measures the next shards of studies/scheduled_campaign/plan.json: the same
# checkpoint and suite, all ten libero_object tasks, every arm the published body ran plus the
# harmless-variation controls, six seeds — sixty (task, seed) shards, one container each, at ONE
# pinned release held until the campaign supersedes the published body. Which shards are done is
# read from results/gpu-scheduled/campaign-<pin>/ (this workflow commits every shard there), so a
# missed run costs a week and not correctness, and a re-run of a slot that already landed selects
# the shards after it rather than writing a duplicate row. After each run the shards are combined
# into campaign.json beside them (scripts/combine_campaign.py) and watch/campaign.json publishes how
# far along the campaign is.
#
# COST, DERIVED IN THE EXAMPLE AND HELD BY A TEST. Five shards a run, twelve episodes each, at the
# measured ~134 s/episode plus ~174 s container setup: about $1.98 a run expected, $3.00 at the
# 45-minute per-container ceiling; at Tuesday+Friday that is ~$17.19 a month expected and ~$26.05
# worst case, of a $30/month credit shared with the manual arms in gpu-arm.yml. Twelve runs, six
# weeks, about $24 for the whole campaign. tests/test_gpu_scheduled_plan.py recomputes those from
# the example's constants and the plan and fails if the ceiling no longer fits — a cost figure in a
# comment is a claim like any other.
#
# WHY TWICE A WEEK. The cadence is derived from the badge, not chosen: watch.py sets STALE_DAYS = 7,
# so a seven-day cadence sits exactly on the red boundary and one missed run turns the badge red.
# Tuesday and Friday give gaps of three and four days, which holds the window with margin. Every
# shard writes a real recorded manifest, so the campaign feeds the age badge as the probe did. Three
# runs a week at this shard count would put the ceiling over the credit; the cadence stays.
#
# PROVENANCE GATE. Every manifest this lane ever committed reported repository, commit,
# dep_lock_digest and precision as missing, and the lane recorded the run anyway. The 2026-09-15
# run did so the day after the checkout step below gained the comment saying the commit gap was
# fixed: the driver passed PROVAEL_COMMIT correctly, and the container installed the released
# 0.41.2 wheel, which reads no such variable. The fix lived in main; the lane runs releases. So
# "Record the measurement" now runs scripts/check_provenance.py first and refuses any shard that
# lacks one of the four, naming which — and until PROVAEL_PIN names a release that fills them, this
# lane runs and records nothing, loudly. That is the honest state.
#
# WHAT THIS LANE CANNOT DO. Between v0.32.0 (8 Aug 2026) and v0.41.2 (9 Sep 2026) nine minor
# releases shipped in thirty-two days; at that cadence the body that displaces the published
# measurement lands roughly a dozen minors behind on the day it completes — past the two-release
# window it is measured against. This lane makes the published measurement move, repeatedly, and
# publishes how far along it is. It cannot make it current. What would: a slower release cadence
# while a campaign runs, or a larger credit. Neither is a code change and neither is claimed here.
#
# This file is named for the fact that it is scheduled, not for its cadence, because the cadence is
# a tuning parameter of STALE_DAYS and has already changed once.
#
# COST SAFETY (handoff to enable):
#   * Disabled unless the repo variable `ENABLE_GPU_SCHEDULED` is set to "true" (Settings -> Variables).
#     Until then every run no-ops in seconds, so a fork or an unconfigured repo can never spend.
#   * The GPU work runs inside Modal (examples/gpu-ci/modal_provael_gpu.py), which caps each
#     container at one L4 for the example's SHARD_TIMEOUT_SECONDS and shuts it down — the budget cap
#     lives with the job, and the ceiling above is that cap times the shards per run.
#   * Requires the MODAL_TOKEN_ID / MODAL_TOKEN_SECRET secrets; without them the job cannot bill.
name: GPU red-team (scheduled, Modal)

on:
  schedule:
    - cron: "17 4 * * 2,5"  # Tue + Fri 04:17 UTC (off-peak, off the :00 fleet spike)
  workflow_dispatch: {}     # allow a manual, maintainer-triggered run

# One run at a time; a new run supersedes an in-flight one so overlaps can't double-spend.
concurrency:
  group: gpu-scheduled
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gpu-redteam:
    # WRITE, because the measurement has to survive the runner. See "Keep the measurement" below:
    # for five runs this lane measured, recorded, and threw the record away with the container.
    permissions:
      contents: write
    # Opt-in only: no variable set -> no run -> no spend.
    if: ${{ vars.ENABLE_GPU_SCHEDULED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # persist-credentials: true, deliberately. This was false, which is the right default for a
      # lane that only reads — and this one has to push the measurement it produces or the whole
      # run is discarded. Scoped by `permissions: contents: write` on the job above.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so the Modal driver can resolve the pinned release tag to its commit
          # and pass it into the container as PROVAEL_COMMIT (execution-manifest provenance;
          # both September 2026 canary manifests recorded `commit: null`). The driver also reads
          # results/ to plan the slice, which needs the tree rather than the history.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # provael too, from THIS checkout: the driver reads the plan and selects shards through
      # provael.campaign. The container installs the pinned release separately, inside the image.
      - name: Install the Modal client and this checkout's provael
        run: |
          pip install "modal>=0.64"
          pip install --quiet -e .

      # `set -o pipefail` is load-bearing, not hygiene. `modal run ... | tee` reports TEE's exit
      # status, so for 22 days this step stayed green while modal exited on "has no functions or
      # local entrypoints" and measured nothing. A lane that cannot fail is a lane that cannot
      # report, and the freshness badge was the only thing telling anyone.
      - name: Run the next shards of the SmolVLA x LIBERO campaign on Modal GPUs
        shell: bash
        run: |
          set -o pipefail
          modal run examples/gpu-ci/modal_provael_gpu.py | tee gpu-scheduled-report.txt
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

      # Record the measurement so the freshness badge has something to age. Guarded on the report
      # actually existing: a run that failed must NOT stamp a fresh measurement time, or the
      # badge would report currency for a run that never produced a number — the precise failure
      # the badge exists to make visible. Freshness badge refresh is a separate, cheap, always-on
      # job (freshness.yml); this step only records.
      # FAILS where it used to warn. A warning inside a green job is the failure mode itself: this
      # step emitted one on every run from 30 Aug to 3 Sep 2026 while the lane reached a real policy
      # and printed a real ASR, and watch/freshness.json sat at 2026-08-09 the whole time (#181).
      # The measurement happening and the measurement being recorded are different events, and only
      # the second one moves the badge — so the second one is what this step reports on.
      - name: Record the measurement in the watch ledger
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # READ the path the run declared. Do not search for it.
          #
          # THE SEARCH COULD NOT WORK, and it took a fourth failure of this lane to see it. This
          # step used to run `find . -name report.json -newer gpu-scheduled-report.txt`, and that
          # predicate is unsatisfiable by construction: the local entrypoint prints its closing
          # line AFTER writing the artifacts, that line goes through the same `tee` that produces
          # gpu-scheduled-report.txt, so the log is always newer than the report it announces.
          # On 4 Sept 2026 — the first scheduled run after #181's fix landed — the lane reached a
          # real policy, printed `Adversarial ASR: 33.3% (4/12)`, wrote three artifacts, and this
          # step said it had produced none.
          #
          # #181 fixed the lane so it WRITES its measurement; this fixes the lane so it can be
          # TOLD where. The filename below is mirrored from `OUT_DIR_FILE` in
          # examples/gpu-ci/modal_provael_gpu.py and pinned by
          # tests/test_modal_examples_are_runnable.py, so the two cannot drift apart silently.
          #
          # ONE SHARD PER CELL since the lane became a campaign: the declared directory holds one
          # sub-directory per task, each a complete run with its own report.json and manifest, and
          # every one of them is recorded. A shard that raised in Modal is simply absent here (see
          # "Report shards that failed" below); it is never a reason to skip the ones that landed.
          outdir_file=gpu-scheduled-outdir.txt
          if [ ! -f "$outdir_file" ]; then
            echo "::error::the run did not declare an output directory ($outdir_file is absent),"
            echo "::error::so nothing was recorded and the freshness badge keeps ageing. Either the"
            echo "::error::local entrypoint failed before writing its artifacts, or it no longer"
            echo "::error::writes OUT_DIR_FILE — see examples/gpu-ci/modal_provael_gpu.py."
            exit 1
          fi
          outdir="$(cat "$outdir_file")"
          shards="$(find "$outdir" -mindepth 1 -maxdepth 2 -name report.json | sort)"
          if [ -z "$shards" ]; then
            echo "::error::the run declared $outdir but no shard under it has a report.json. The"
            echo "::error::measurement was not recorded. This is #181's shape again: check that"
            echo "::error::examples/gpu-ci/modal_provael_gpu.py still RETURNS its artifacts AND"
            echo "::error::that the entrypoint writes them before declaring the path."
            ls -laR "$outdir" 2>/dev/null || echo "(the directory does not exist)"
            exit 1
          fi
          # PROVENANCE FIRST. A shard whose manifest cannot say which repository, which commit,
          # which dependency set and which precision produced it is not recorded, because the
          # combiner below promotes shards into a published number. The script names the shard and
          # the field; a release whose wheel predates the fields fails here on every run, which is
          # the correct thing for it to do.
          shard_dirs="$(for report in $shards; do dirname "$report"; done)"
          python scripts/check_provenance.py $shard_dirs
          for shard in $shard_dirs; do
            provael watch --record "$shard" --dir watch
            echo "recorded $shard/report.json"
          done
          echo "OUTDIR=$outdir" >> "$GITHUB_ENV"

      # KEEP THE MEASUREMENT. The fifth failure of this lane, and the first where everything worked.
      #
      # `provael watch --record` appends to watch/watch.jsonl and watch/trials.jsonl in the RUNNER'S
      # working tree. This job declared `contents: read`, checked out with `persist-credentials:
      # false`, and uploaded only the log. So on 5 September 2026 run 33974192486 reached a real
      # policy, printed `Adversarial ASR: 33.3% (4/12)`, logged `recorded smolvla x libero (4/14)
      # measured with provael 0.39.1` — and the container shut down and took it with it. Neither
      # watch.jsonl nor trials.jsonl has ever existed in this repository. freshness.yml recomputed
      # the next morning from what was committed, found nothing new, and watch/freshness.json stayed
      # at 2026-08-09. www.provael.com fails its own build once that passes 30 days.
      #
      # COMMITTING watch.jsonl ALONE WOULD HAVE BEEN WORSE THAN NOTHING, and this was simulated
      # before it was written. `latest_measurement()` unions the watch log with the committed
      # manifests; `scripts/gen_measurement_ledger.py` reads ONLY results/. So the badge would have
      # gone brightgreen while the ledger's newest row stayed a month old, and
      # test_measurement_ledger.py::test_newest_real_measurement_agrees_with_the_badge would have
      # failed — correctly. www.provael.com renders that ledger on /results, so the shipped state
      # would have been a green "measured today" banner above a table whose newest row was August.
      #
      # So the run is committed to results/, which is what results/ is for, and both surfaces read
      # the same tree. Simulated against a copy of results/ first: ledger row present with a real
      # artifactPath, badge and ledger agreeing on the instant.
      #
      # WHAT THIS GROWS. Four small shard directories twice a week, a few MB a year, and four
      # ledger rows a week on /results. That is readable now and will not be forever; when it stops
      # being readable the answer is pagination on the page, never pruning the record here. The
      # plan for the NEXT run is read from exactly this tree, so pruning it would also re-measure
      # cells that were already paid for.
      - name: Keep the measurement
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # Into the CAMPAIGN directory, named for the release the shards actually ran — read
          # from a shard's own report rather than from the driver's constant, so the artifact and
          # not the configuration says where it belongs. One sub-directory per shard, named by the
          # plan's shard id, which is what makes a re-run of the same shard a no-op: the next run
          # sees the directory and selects the shards after it.
          version="$(python -c 'import json, pathlib, sys; p = sorted(pathlib.Path(sys.argv[1]).glob("*/report.json"))[0]; print(json.loads(p.read_text())["tool_version"])' "$OUTDIR")"
          dest="results/gpu-scheduled/campaign-$version"
          mkdir -p "$dest"
          cp -R "$OUTDIR"/. "$dest"/
          echo "placed the shards under $dest"

          # Regenerate exactly the artifacts derived from results/, so none can disagree with the
          # tree it is derived from. NOT watch/coverage.json or watch/registry.json: despite living
          # in the same directory those are a shields.io TEST-coverage badge and a code-derived
          # registry, both owned by coverage-badge.yml. Writing `provael coverage --json` over
          # coverage.json would replace a badge with a different shape entirely.
          #
          # In order: the campaign's own combined view (campaign.json beside the shards, through
          # the combiner `provael evidence-manifest` uses; it refuses a shard without provenance
          # and says `complete: false` until every planned shard is present), then the ledger,
          # then publish-freshness.json — which since 18 September 2026 carries the challenger
          # body, so every shard changes it and its --check would go red on main without this —
          # then watch/campaign.json, the progress a page renders instead of a flat STALE.
          python scripts/combine_campaign.py
          python scripts/gen_measurement_ledger.py
          make gen-publish-freshness
          python scripts/gen_campaign_progress.py

          # DELETE THE LOG BEFORE REGENERATING THE BADGE. Not housekeeping — this is the bug the
          # first version of this step shipped, on its first real run.
          #
          # `latest_measurement()` unions read_measurements(watch/) with the committed manifests and
          # takes the max. The `--record` step above writes watch/watch.jsonl with `measured_at =
          # _now()`, which is wall-clock at RECORD time; the manifest carries `ended_at`, which is
          # when the run actually finished. On run 34051694289 those were 19:03:58 and 19:03:46. So
          # the badge took 19:03:58 from a file this step then declined to commit, the ledger took
          # 19:03:46 from the run that WAS committed, and
          # test_newest_real_measurement_agrees_with_the_badge went red on main — correctly. The
          # badge was asserting an instant no committed artifact supported.
          #
          # The log stays uncommitted for the reason below; what changed is that it is also gone
          # before anything reads it. The badge now derives from exactly the tree that ships.
          #
          # WHY THE LOG IS NOT COMMITTED: the run is in results/, which is the one tree both the
          # ledger and the badge read. Committing the log as well would put the same measurement in
          # two places read by different code paths — the exact asymmetry that made committing the
          # log ALONE unsafe.
          rm -f watch/watch.jsonl watch/trials.jsonl
          provael watch --dir watch || true

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest" watch/measurements.json watch/freshness.json watch/publish-freshness.json watch/campaign.json
          if git diff --cached --quiet; then
            echo "::error::the run produced $dest and git sees nothing to commit. The measurement"
            echo "::error::is about to be discarded again — this is the defect this step exists for."
            exit 1
          fi
          # [skip ci]: this lands in watch/**, which triggers freshness.yml — a self-retrigger loop
          # masked only by GitHub declining to run workflows on GITHUB_TOKEN pushes. Same note as
          # freshness.yml carries; do not rely on that alone.
          git commit -m "chore(results): keep the scheduled campaign shards [skip ci]"

          # Rebase-and-retry rather than fail: freshness.yml and coverage-badge.yml also push to
          # main on their own schedules, and losing a real GPU measurement to a race would be the
          # sixth version of this bug.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase --autostash
          done
          echo "::error::could not push the measurement after 3 attempts. It exists in this runner"
          echo "::error::and nowhere else, which is exactly how the previous five were lost."
          exit 1

      # AFTER the good shards are committed, and only then: a shard that raised in Modal fails the
      # job. Before this step, a lane with one broken shard had two bad options — lose the four
      # good shards with it, or stay green and let the missing shard show up only as a slower
      # `projected.completion` in watch/campaign.json. The file is written by the example's
      # entrypoint (FAILED_SHARDS_FILE) and is absent when every shard returned.
      - name: Report shards that failed
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gpu-scheduled-failed-shards.txt ]; then
            echo "::error::the shards below raised in Modal. The others were recorded and committed;"
            echo "::error::these shards stay unmeasured and the next run selects them again."
            cat gpu-scheduled-failed-shards.txt
            exit 1
          fi
          echo "every shard returned"

      - name: Upload the run artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpu-scheduled-report
          path: gpu-scheduled-report.txt
          retention-days: 30
      # HANDOFF: to emit a *signed* attestation artifact, have the Modal entrypoint run
      # `provael attest` on the produced report and return its JSON, then persist it here. The
      # signing key belongs in Modal secrets (never in this repo). See ROADMAP §5 / P0.5b.
