# Scheduled real-model GPU red-team (SmolVLA x LIBERO) via Modal — budget-capped, OFF by default.
#
# This runs the GATED integration path on a real GPU on a schedule, so the repo's honest transfer
# numbers stay fresh without a maintainer running anything by hand. It is deliberately isolated from
# ci.yml: the CPU core CI never installs the [lerobot] extra, never touches a GPU, and stays free and
# green regardless of this file.
#
# WHY WEEKLY, AND WHY THE RUN SHRANK. This was nightly at `--seeds 10`, advertised as ~$0.02/run.
# That figure was never recomputed after the run grew. `none,instruction,visual,injection` expands
# to EIGHT arms, and `task_ids` defaults to one task, so ten seeds is 80 episodes. This repo's own
# measured anchor is 400 episodes in 15.4 L4-hours, i.e. ~139 s/episode — so 80 episodes is ~3
# hours against a 1h Modal timeout. Every night it would have burned the full hour, been killed,
# recorded nothing, and cost ~$0.80: about $24/month of a $30/month credit, for no measurement.
#
# The schedule was the expensive part, not the run. Two seeds is 16 episodes, ~37 min, ~$0.49/run,
# and it finishes, which the nightly never could. The badge this feeds carries a timestamp and no
# rate, so fewer seeds cannot weaken a published number.
#
# WHY TWICE A WEEK RATHER THAN WEEKLY. The cadence is derived from the badge, not chosen: watch.py
# sets STALE_DAYS = 7, so a seven-day cadence sits exactly on the red boundary and one missed run
# turns the badge red. Tuesday and Friday give gaps of three and four days, which holds the window
# with margin, at ~$4.25/month of a $30/month credit. Green needs FRESH_DAYS = 2, i.e. a run every
# other day at ~$7.40/month, which is not worth a quarter of the budget for a canary.
#
# This file is named for the fact that it is scheduled, not for its cadence, because the cadence is
# a tuning parameter of STALE_DAYS and has already changed once.
#
# COST SAFETY (handoff to enable):
#   * Disabled unless the repo variable `ENABLE_GPU_SCHEDULED` is set to "true" (Settings -> Variables).
#     Until then every run no-ops in seconds, so a fork or an unconfigured repo can never spend.
#   * The GPU work runs inside Modal (examples/gpu-ci/modal_provael_gpu.py), which caps each run at
#     one L4 for <=1h and shuts the container down — the budget cap lives with the job. That cap is
#     now a backstop rather than the expected runtime, which is the point of the change above.
#   * Requires the MODAL_TOKEN_ID / MODAL_TOKEN_SECRET secrets; without them the job cannot bill.
name: GPU red-team (scheduled, Modal)

on:
  schedule:
    - cron: "17 4 * * 2,5"  # Tue + Fri 04:17 UTC (off-peak, off the :00 fleet spike)
  workflow_dispatch: {}     # allow a manual, maintainer-triggered run

# One run at a time; a new run supersedes an in-flight one so overlaps can't double-spend.
concurrency:
  group: gpu-scheduled
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gpu-redteam:
    # Opt-in only: no variable set -> no run -> no spend.
    if: ${{ vars.ENABLE_GPU_SCHEDULED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the Modal client
        run: pip install "modal>=0.64"

      # `set -o pipefail` is load-bearing, not hygiene. `modal run ... | tee` reports TEE's exit
      # status, so for 22 days this step stayed green while modal exited on "has no functions or
      # local entrypoints" and measured nothing. A lane that cannot fail is a lane that cannot
      # report, and the freshness badge was the only thing telling anyone.
      - name: Run the real SmolVLA x LIBERO red-team on a Modal GPU
        shell: bash
        run: |
          set -o pipefail
          modal run examples/gpu-ci/modal_provael_gpu.py | tee gpu-scheduled-report.txt
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

      # Record the measurement so the freshness badge has something to age. Guarded on the report
      # actually existing: a run that failed must NOT stamp a fresh measurement time, or the
      # badge would report currency for a run that never produced a number — the precise failure
      # the badge exists to make visible. Freshness badge refresh is a separate, cheap, always-on
      # job (freshness.yml); this step only records.
      - name: Record the measurement in the watch ledger
        if: success()
        run: |
          report="$(find . -name report.json -newer gpu-scheduled-report.txt -print -quit 2>/dev/null || true)"
          if [ -z "$report" ]; then
            echo "::warning::no report.json produced by the scheduled run — nothing recorded, badge keeps ageing"
            exit 0
          fi
          pip install --quiet -e .
          provael watch --record "$(dirname "$report")" --dir watch
          echo "recorded $report"

      - name: Upload the run artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpu-scheduled-report
          path: gpu-scheduled-report.txt
          retention-days: 30
      # HANDOFF: to emit a *signed* attestation artifact, have the Modal entrypoint run
      # `provael attest` on the produced report and return its JSON, then persist it here. The
      # signing key belongs in Modal secrets (never in this repo). See ROADMAP §5 / P0.5b.
