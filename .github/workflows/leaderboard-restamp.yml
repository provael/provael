# Re-stamp and re-sign the committed leaderboard, without re-measuring anything.
#
# WHY THIS EXISTS. `tests/test_leaderboard.py::test_committed_leaderboard_stamp_is_not_too_far_
# behind_the_release_line` fails a release whose newest tag is more than MAX_STAMP_LAG_DAYS past
# the board's `generated_at`. It is deterministic — it can only turn red when a NEW TAG is created,
# never from wall-clock drift — so it fires during a release and blocks it. That is what happened
# to v0.39.0: the board was stamped 17 Aug, the tag landed 1 Sep, and the gate refused at 14 days
# and 14 hours.
#
# The fix the test names is a GPU-free re-stamp from the already-committed run reports. Doing it by
# hand needs the Ed25519 private key on someone's laptop; doing it here needs only the
# PROVAEL_SIGNING_KEY secret that already exists for `checkpoint-security-gate.yml`, so the key
# never leaves GitHub and never reaches a workstation.
#
# WHAT A RE-STAMP IS AND IS NOT, because the difference is the whole point. It re-aggregates the
# SAME committed reports: `measured_with` is read from them, so the rows keep the version that
# actually measured them and `staleness()` returns the same verdict. Only `generated_at`, `commit`
# and `tool_version` move. `Leaderboard.is_restamp()` exists precisely to expose a board assembled
# by a version that measured none of its own rows, and the guard step below REFUSES to commit if
# the re-stamp cleared `stale` or altered `measured_with` — a re-stamp that laundered staleness
# would be worse than a blocked release, and unlike a blocked release nobody would notice.
#
# Dispatch-only, never automatic: moving the date on a signed, dated artifact is a deliberate act.
name: Leaderboard re-stamp

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this re-stamp is being run (recorded in the commit message)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: leaderboard-restamp
  cancel-in-progress: false

jobs:
  restamp:
    name: re-stamp and re-sign, without re-measuring
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # commits the re-stamped board
    steps:
      # MAIN IS PROTECTED, and GITHUB_TOKEN cannot cross a ruleset. Since 20 September 2026 `main`
      # requires a pull request and passing checks (docs/maintainers/github-security-settings.md);
      # the only bypass actor is the repository's own GitHub App, so this job pushes with a
      # short-lived installation token of that App instead of the workflow token. Absent secrets
      # FAIL here, on purpose: a fallback to GITHUB_TOKEN would be refused at push time after the
      # work was done, or — worse — pass quietly if the ruleset were ever loosened.
      - name: The bot App secrets must exist (main is protected)
        env:
          APP_ID: ${{ secrets.PROVAEL_BOT_APP_ID }}
          APP_KEY: ${{ secrets.PROVAEL_BOT_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error title=bot App token missing::main is protected by a ruleset that GITHUB_TOKEN cannot bypass. Create the repository's GitHub App and set PROVAEL_BOT_APP_ID and PROVAEL_BOT_PRIVATE_KEY (docs/maintainers/github-security-settings.md)."
            exit 1
          fi
      - name: Mint the bot App token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PROVAEL_BOT_APP_ID }}
          private-key: ${{ secrets.PROVAEL_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ steps.bot.outputs.token }}  # the App token; see the steps above
          persist-credentials: true
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (locked, CPU core + attest extra)
        run: uv sync --locked --extra attest

      - name: Record the board's pre-state
        id: before
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open("leaderboard/results/leaderboard.json"))
          print(f"stale={json.dumps(d.get('stale'))}")
          print(f"measured_with={json.dumps(d.get('measured_with'))}")
          print(f"submitters={json.dumps(sorted({r.get('submitted_by') for r in d['rows'] if r.get('submitted_by')}))}")
          print(f"generated_at={d.get('generated_at')}")
          PY

      - name: Re-stamp and re-sign
        env:
          PROVAEL_SIGNING_KEY: ${{ secrets.PROVAEL_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PROVAEL_SIGNING_KEY}" ]; then
            echo "::error::PROVAEL_SIGNING_KEY is not set; an ephemeral key would break every"
            echo "::error::published verification against leaderboard.pub. Refusing."
            exit 1
          fi
          KEY="${RUNNER_TEMP}/leaderboard.pem"
          umask 077
          printf '%s' "${PROVAEL_SIGNING_KEY}" > "${KEY}"
          trap 'rm -f "${KEY}"' EXIT
          # --submitted-by / --provenance are NOT optional here. Omitting them on the first
          # real run silently dropped every row's attribution: submitted_by 'provael' -> None,
          # provenance 'maintainer-run' -> 'unattributed'. The board still verified and still
          # declared its staleness, so nothing downstream complained — it just stopped recording
          # who ran it, which is the one field that separates a maintainer board from an
          # anonymous submission.
          # The run the board aggregates is the one leaderboard/results/source.json names — never
          # a path typed here. This step used to say `results/smolvla_libero_object_suite` (the
          # 0.32.0 run); after leaderboard-rebuild.yml moved the board to the 14 September 2026
          # re-measurement (#257) that literal would have rebuilt the OLD run and the guard below
          # would have refused it as "measured_with moved". Read the pointer.
          RUN="$(python -c 'import json; print(json.load(open("leaderboard/results/source.json"))["run"])')"
          echo "re-stamping from ${RUN}"
          uv run provael leaderboard build \
            --real "${RUN}" \
            --submitted-by provael --provenance maintainer-run \
            --sign --key "${KEY}" \
            --out leaderboard/results

      - name: The signature must still verify against the PUBLISHED public key
        run: |
          uv run provael leaderboard verify \
            --in leaderboard/results/leaderboard.json \
            --pubkey leaderboard/results/leaderboard.pub

      - name: Refuse a re-stamp that laundered staleness
        env:
          BEFORE_STALE: ${{ steps.before.outputs.stale }}
          BEFORE_MEASURED: ${{ steps.before.outputs.measured_with }}
          BEFORE_SUBMITTERS: ${{ steps.before.outputs.submitters }}
        run: |
          python - <<'PY'
          import json, os, sys
          d = json.load(open("leaderboard/results/leaderboard.json"))
          before_stale = json.loads(os.environ["BEFORE_STALE"])
          before_measured = json.loads(os.environ["BEFORE_MEASURED"])
          bad = []
          if d.get("measured_with") != before_measured:
              bad.append(f"measured_with moved {before_measured} -> {d.get('measured_with')}")
          if before_stale is True and d.get("stale") is not True:
              bad.append(f"stale was cleared: {before_stale} -> {d.get('stale')}")
          # Added after the first real run dropped every row's attribution while passing the two
          # checks above. The guard watched what I had thought about; the board had other fields
          # that mattered. Anything a re-stamp must preserve belongs in THIS list.
          before_subs = json.loads(os.environ["BEFORE_SUBMITTERS"])
          now_subs = sorted({r.get("submitted_by") for r in d["rows"] if r.get("submitted_by")})
          if before_subs and now_subs != before_subs:
              bad.append(f"submitters changed {before_subs} -> {now_subs}")
          if bad:
              print("::error::a re-stamp must not change what was measured or how stale it is")
              for b in bad:
                  print(f"::error::{b}")
              sys.exit(1)
          print(f"OK  stale={d.get('stale')}  measured_with={d.get('measured_with')}")
          print(f"    generated_at -> {d.get('generated_at')}  tool_version -> {d.get('tool_version')}")
          PY

      - name: Keep the source pointer in step with the re-stamped board
        # source.json's generatedAt is asserted equal to the board's generated_at
        # (tests/test_leaderboard_version_claim.py); a re-stamp moves the board's and must move the
        # pointer's with it. run, measuredWith and reason are untouched: nothing was re-measured.
        run: |
          python - <<'PY'
          import json
          board = json.load(open("leaderboard/results/leaderboard.json"))
          path = "leaderboard/results/source.json"
          pointer = json.load(open(path))
          pointer["generatedAt"] = board.get("generated_at")
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(pointer, fh, indent=1, sort_keys=True)
              fh.write("\n")
          print(f"source.json generatedAt -> {pointer['generatedAt']}")
          PY

      - name: Commit
        env:
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if git diff --quiet -- leaderboard/results/leaderboard.json leaderboard/results/source.json; then
            echo "board unchanged; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboard/results/leaderboard.json leaderboard/results/source.json
          # No CI-skip token anywhere in this message, deliberately. One quoted in prose on the
          # 0.38.1 release was honoured by GitHub on the squashed merge commit and skipped every
          # workflow for it, including the release tag. This commit SHOULD run CI.
          # No skip marker on this commit, deliberately. The push uses the bot App token (main is protected), and
          # an App push triggers the push-to-main workflows that a GITHUB_TOKEN push never did —
          # so from 20 September 2026 CI runs on the re-stamped board and the board's own tests
          # (tests/test_leaderboard_version_claim.py) check the commit that changed it. None of
          # the triggered workflows pushes back, so there is no loop to break.
          git commit -m "chore(leaderboard): re-stamp the signed board (no re-measurement)" \
                     -m "Reason: ${REASON}" \
                     -m "Re-aggregated from the committed run leaderboard/results/source.json names. measured_with is unchanged and asserted so by the workflow; stale may only move false -> true (the release moved past the board); generated_at, commit and tool_version move."
          git push
