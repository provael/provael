# Refresh the "last measured" freshness badge — daily, on CPU, free, and DELIBERATELY independent
# of whether any measurement ran.
#
# WHY THIS IS A SEPARATE WORKFLOW FROM gpu-scheduled.yml. The obvious design is to have the
# measurement emit its own green badge. That fails in exactly the case the badge exists for: if the
# measurement stops running — disabled, out of budget, broken, or never enabled in the first place —
# nothing regenerates the file and the badge stays frozen on the last green it ever wrote. A
# freshness indicator that cannot go stale-red is worse than none, because it actively asserts
# currency it is not checking. The published board sat a month stale under exactly that kind of
# silence.
#
# So the age is recomputed here, from the recorded measurement time, on a schedule that runs
# whether or not anything was measured. The badge reddens by itself the moment measurements stop.
# This job needs no GPU, no Modal account and no secrets, so it keeps working when the expensive
# lane is off — which is the state the repo is actually in.
name: Freshness badge

on:
  schedule:
    - cron: "23 5 * * *"  # 05:23 UTC daily, off the :00 fleet spike
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["watch/**"]  # a newly recorded measurement should update the badge immediately

permissions:
  contents: read

concurrency:
  group: freshness
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # commits the recomputed badge JSON
    steps:
      # MAIN IS PROTECTED, and GITHUB_TOKEN cannot cross a ruleset. Since 20 September 2026 `main`
      # requires a pull request and passing checks (docs/maintainers/github-security-settings.md);
      # the only bypass actor is the repository's own GitHub App, so this job pushes with a
      # short-lived installation token of that App instead of the workflow token. Absent secrets
      # FAIL here, on purpose: a fallback to GITHUB_TOKEN would be refused at push time after the
      # work was done, or — worse — pass quietly if the ruleset were ever loosened.
      - name: The bot App secrets must exist (main is protected)
        env:
          APP_ID: ${{ secrets.PROVAEL_BOT_APP_ID }}
          APP_KEY: ${{ secrets.PROVAEL_BOT_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error title=bot App token missing::main is protected by a ruleset that GITHUB_TOKEN cannot bypass. Create the repository's GitHub App and set PROVAEL_BOT_APP_ID and PROVAEL_BOT_PRIVATE_KEY (docs/maintainers/github-security-settings.md)."
            exit 1
          fi
      - name: Mint the bot App token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PROVAEL_BOT_APP_ID }}
          private-key: ${{ secrets.PROVAEL_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ steps.bot.outputs.token }}  # the App token; see the steps above
          persist-credentials: true  # the commit below pushes; see docs.yml for the same pattern

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Sync (locked, CPU core only)
        run: uv sync --locked

      # No --record: this recomputes the AGE of what is already recorded. That is the whole point.
      - name: Recompute the freshness badge
        run: uv run provael watch --dir watch || true

      # `|| true` above and the explicit report here are deliberate: `provael watch` exits non-zero
      # when the measurement is stale, and a stale measurement must still PUBLISH the red badge
      # rather than fail the job before writing it. The staleness is reported in the summary
      # instead, so it is visible without a red X that would train the maintainer to ignore it.
      - name: Report the freshness state
        run: |
          {
            echo "### Measurement freshness"
            echo ""
            echo '```json'
            cat watch/freshness.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the badge if it changed
        run: |
          if git diff --quiet -- watch/freshness.json; then
            echo "badge unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch/freshness.json
          # [skip ci]: this commit lands in watch/**, which is this workflow's own trigger
          # path — a self-retrigger loop. Until 20 September 2026 it was masked by GitHub
          # declining to run workflows on GITHUB_TOKEN pushes; the push now uses the bot App
          # token (main is protected) and App pushes DO trigger workflows, so this marker is
          # the only thing between the job and a loop. Keep it.
          git commit -m "chore(watch): refresh the measurement-freshness badge [skip ci]"
          git push
