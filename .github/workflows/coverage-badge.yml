name: Coverage badge

# WHY THIS IS ITS OWN WORKFLOW AND NOT A STEP IN ci.yml.
#
# ci.yml is deliberately `contents: read` with `persist-credentials: false`, so that a pull request
# from a fork cannot use it to obtain a write token. Committing a regenerated badge needs write, and
# bolting that onto ci.yml would hand every fork PR a privileged workflow to aim at — a real
# security regression traded for a cosmetic convenience.
#
# So the split mirrors freshness.yml exactly: measurement happens in the read-only lane on every PR
# (with `--cov-fail-under` as the gate), and only the badge COMMIT lives here, on main, after the
# merge is already trusted.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: coverage-badge
  cancel-in-progress: true

jobs:
  badge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # commits the regenerated badge JSON
    steps:
      # MAIN IS PROTECTED, and GITHUB_TOKEN cannot cross a ruleset. Since 20 September 2026 `main`
      # requires a pull request and passing checks (docs/maintainers/github-security-settings.md);
      # the only bypass actor is the repository's own GitHub App, so this job pushes with a
      # short-lived installation token of that App instead of the workflow token. Absent secrets
      # FAIL here, on purpose: a fallback to GITHUB_TOKEN would be refused at push time after the
      # work was done, or — worse — pass quietly if the ruleset were ever loosened.
      - name: The bot App secrets must exist (main is protected)
        env:
          APP_ID: ${{ secrets.PROVAEL_BOT_APP_ID }}
          APP_KEY: ${{ secrets.PROVAEL_BOT_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error title=bot App token missing::main is protected by a ruleset that GITHUB_TOKEN cannot bypass. Create the repository's GitHub App and set PROVAEL_BOT_APP_ID and PROVAEL_BOT_PRIVATE_KEY (docs/maintainers/github-security-settings.md)."
            exit 1
          fi
      - name: Mint the bot App token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PROVAEL_BOT_APP_ID }}
          private-key: ${{ secrets.PROVAEL_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ steps.bot.outputs.token }}  # the App token; see the steps above
          persist-credentials: true # the commit below pushes; same pattern as freshness.yml

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Sync (locked, CPU core only)
        run: uv sync --locked

      # No --cov-fail-under here: the gate already ran in ci.yml on the way in. This job's only job
      # is to publish the number, and failing it would leave the badge showing an older figure while
      # the run went red — the worst of both.
      # Tolerant ON PURPOSE, and now tolerant BY DECLARATION rather than by accident. Without
      # `pipefail` this step took TEE's status, so it could not have failed even if someone wanted
      # it to — the same defect that let ci.yml's gate go green over 16 failing tests. The intent
      # above is still right, so the tolerance is kept and made explicit: pipefail is set, the
      # failure is caught, and it is announced instead of vanishing. The premise that sentence
      # rests on ("the gate already ran in ci.yml") is only true now that ci.yml can fail.
      - name: Measure coverage
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q --cov=src/provael --cov-report=term | tee /tmp/cov.out \
            || echo "::warning::tests failed; publishing the coverage number anyway — ci.yml is the gate for pass/fail"

      - name: Regenerate the badge
        run: |
          PCT=$(grep -E '^TOTAL' /tmp/cov.out | awk '{print $NF}' | tr -d '%')
          if [ -z "$PCT" ]; then
            echo "::error::could not parse a coverage total — refusing to write a badge from nothing"
            exit 1
          fi
          COLOR=brightgreen
          [ "$PCT" -lt 85 ] && COLOR=yellow
          [ "$PCT" -lt 70 ] && COLOR=red
          printf '{\n  "cacheSeconds": 3600,\n  "color": "%s",\n  "label": "coverage",\n  "message": "%s%%",\n  "schemaVersion": 1\n}\n' "$COLOR" "$PCT" > watch/coverage.json
          {
            echo "### Coverage"
            echo ""
            echo '```json'
            cat watch/coverage.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the registry counts alongside the badge
        # Rides along for the same reason and by the same rule as the coverage total: both are
        # properties of the installed package, and www.provael.com derives its family and attack
        # counts from this file rather than restating them in prose.
        run: uv run python scripts/gen_registry_artifact.py

      - name: Publish the current release alongside them
        # Same rule again: a property of the installed package that a consumer would otherwise keep
        # its own copy of. www.provael.com served v0.39.3 on 14 pages while the tag and PyPI said
        # 0.39.4, because the copy was refreshed on the release cadence by hand. Regenerated here as
        # a safety net; the release PR commits it too, and tests/test_release_artifact.py fails if
        # the two ever disagree.
        run: uv run python scripts/gen_release_artifact.py

      - name: Commit the badge if it changed
        run: |
          # BOTH FILES, and the plural in this step's commit message has been a lie since the
          # registry artifact was added. The gate and the `git add` below both named
          # watch/coverage.json alone, so a run where the REGISTRY counts moved and the coverage
          # total did not exited at "badge unchanged" and threw the regenerated registry.json away
          # — the same shape as the GPU lane measuring and discarding (#181). It never surfaced
          # because `tests/test_registry_artifact_agrees.py` fails the next PR instead, which turns
          # a self-healing job into a chore for whoever pushes next.
          if git diff --quiet -- watch/coverage.json watch/registry.json watch/release.json; then
            echo "coverage badge, registry counts and release artifact all unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch/coverage.json watch/registry.json watch/release.json
          # [skip ci] is belt-and-braces, and the braces matter more than they look.
          # This job writes watch/coverage.json, which sits inside freshness.yml's
          # `paths: ["watch/**"]` trigger — so this commit would fire THAT workflow, and
          # freshness.yml's own commit would fire itself. Until 20 September 2026 neither
          # happened only because GitHub does not trigger workflows from GITHUB_TOKEN pushes;
          # this job now pushes with the bot App token (main is protected), and an App push DOES
          # trigger workflows — so [skip ci] is the protection now, not belt-and-braces. The
          # paths allow-list above stops THIS workflow retriggering itself; this stops the
          # cross-trigger too.
          git commit -m "chore(ci): refresh the coverage badge, registry counts and release artifact [skip ci]"
          git push
