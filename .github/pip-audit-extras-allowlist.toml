# Reviewed allow-list for the GPU-extras audit in .github/workflows/ci.yml.
#
# The audit exports [lerobot], [openvla], [attest] and [hosted], runs pip-audit, and hands the JSON
# to scripts/check_audit_allowlist.py, which fails on anything this file does not account for. One
# table per advisory:
#
#   id         what pip-audit prints, or any alias of it (GHSA, CVE)
#   package    as the audit names it
#   version    the version the reason was written against; a bump asks for a fresh read
#   reason     what was found in the code, not what seems likely
#   reachable  "no" or "not assessed". "yes" fails the job: a reachable advisory goes in an issue,
#              stays off this list, and leaves the lane failing until it is dealt with.
#   review_by  a TOML date at most 60 days out; the job fails the day after it
#   in_feed    optional, default true. false means neither PyPI's feed nor OSV maps this id to the
#              package, so the audit cannot report it and its absence is not staleness. The job
#              fails if the audit starts reporting it, because that is news worth reading.
#
# An entry the audit no longer reports fails the job as stale: remove it.
#
# Reasons below were written on 7 November 2026 against uv.lock, reading the wheels the lock pins
# (lerobot 0.5.1, transformers 5.3.0, datasets 4.8.5, diffusers 0.35.2, accelerate 1.13.0,
# fsspec 2026.2.0, setuptools 80.10.2, timm 1.0.27) and Provael's src, scripts and examples. They
# describe the paths Provael's own calls take; they say nothing about code a model repo brings with
# it under trust_remote_code. PYSEC-2026-2290's was written on 10 November 2026, with the check
# before load that it names.

[[advisory]]
id = "GHSA-f7vj-73pm-m822"
package = "lerobot"
version = "0.5.1"
reason = "LeRobot PolicyServer pickle RCE. Unreachable through Provael: the [lerobot] extra is used in-process for policy loading and the LIBERO simulator; no gRPC/PolicyServer is ever started. No released lerobot carries a fix (PR #3048 open, the advisory lists no patched version), and the 0.5.1 pin is a bounded exception documented in SECURITY.md and pyproject.toml. Re-examine when the pin moves. Update, 7 November 2026: PR #3048 closed unmerged on 7 October."
reachable = "no"
review_by = 2027-01-05
in_feed = false

